[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-gen"
version = "0.1.0"
description = "Turn a JSON config into a professional PDF invoice in one function call."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "weasyprint",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-snapshot",
    "black",
    "ruff",
    "mypy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
